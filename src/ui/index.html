<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KAIROS | Knowledge Augmented Insights and Retention Optimization System</title>
  <style>
    :root {
      --bg: #F3F5FA;
      --card: #fff;
      --ink: #17182B;
      --mut: #6A7192;
      --line: #E4E8F2;
      --side: #14162B;
      --side2: #1D2040;
      --acc: #3B6FE0;
      --acc2: #2A9D8F;
      --high: #E5484D;
      --med: #F2A024;
      --low: #2FA56F;
      --soft: #EEF2FC;
      --shadow: 0 1px 2px rgba(20, 22, 43, .06), 0 4px 14px rgba(20, 22, 43, .05)
    }

    [data-theme=dark] {
      --bg: #0F1120;
      --card: #181B31;
      --ink: #ECEEF9;
      --mut: #9AA1C4;
      --line: #2A2E4A;
      --side: #0A0B18;
      --side2: #161934;
      --soft: #20243F;
      --shadow: none
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%
    }

    body {
      margin: 0;
      font: 14.5px/1.5 Inter, system-ui, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink)
    }

    button {
      font: inherit;
      cursor: pointer
    }

    #app {
      display: grid;
      grid-template-columns: 230px 1fr;
      min-height: 100%
    }

    aside {
      background: linear-gradient(180deg, var(--side), var(--side2));
      color: #CBD0F0;
      padding: 20px 14px;
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column
    }

    .logo {
      font-weight: 800;
      letter-spacing: .14em;
      font-size: 20px;
      color: #fff;
      padding: 2px 10px 2px
    }

    .logo small {
      display: block;
      font-weight: 500;
      letter-spacing: .02em;
      font-size: 11.5px;
      color: #8D93BC;
      margin-top: 2px
    }

    nav {
      margin-top: 22px;
      display: flex;
      flex-direction: column;
      gap: 3px
    }

    nav a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 9px;
      color: #B8BEE6;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer
    }

    nav a:hover {
      background: rgba(255, 255, 255, .07)
    }

    nav a.on {
      background: var(--acc);
      color: #fff
    }

    nav a .ic {
      width: 18px;
      text-align: center
    }

    nav a .cnt {
      margin-left: auto;
      background: var(--acc2);
      color: #fff;
      border-radius: 10px;
      padding: 0 8px;
      font-size: 12px
    }

    .sidefoot {
      margin-top: auto;
      font-size: 11.5px;
      color: #7F86B3;
      padding: 8px 10px
    }

    main {
      min-width: 0
    }

    .top {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 14px 28px;
      background: var(--card);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 5;
      flex-wrap: wrap
    }

    .top h1 {
      font-size: 18px;
      margin: 0;
      flex: 1;
      min-width: 180px
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      background: var(--soft);
      padding: 4px 11px;
      border-radius: 20px;
      font-size: 12.5px;
      color: var(--mut)
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--low)
    }

    .dot.bad {
      background: var(--high)
    }

    input,
    select,
    textarea {
      font: inherit;
      padding: 7px 10px;
      border-radius: 9px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      min-width: 0
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: 2px solid color-mix(in srgb, var(--acc) 40%, transparent);
      border-color: var(--acc)
    }

    #view {
      padding: 22px 28px 50px;
      max-width: 1280px
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px 20px;
      box-shadow: var(--shadow);
      margin-bottom: 16px
    }

    .card h2 {
      margin: 0 0 4px;
      font-size: 16px
    }

    .card h3 {
      margin: 16px 0 8px;
      font-size: 12px;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--mut)
    }

    .sub {
      color: var(--mut);
      font-size: 13px;
      margin: 0 0 12px
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap
    }

    .grid {
      display: grid;
      gap: 14px
    }

    .g4 {
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr))
    }

    .g2 {
      grid-template-columns: repeat(auto-fit, minmax(380px, 1fr))
    }

    .g3 {
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr))
    }

    .kpi {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
      box-shadow: var(--shadow)
    }

    .kpi .v {
      font-size: 26px;
      font-weight: 800;
      line-height: 1.15
    }

    .kpi .l {
      color: var(--mut);
      font-size: 12.5px
    }

    .btn {
      background: var(--acc);
      color: #fff;
      border: 0;
      border-radius: 9px;
      padding: 8px 15px;
      font-weight: 700
    }

    .btn:hover {
      filter: brightness(1.08)
    }

    .btn.ghost {
      background: var(--soft);
      color: var(--ink);
      border: 1px solid var(--line)
    }

    .btn.sm {
      padding: 4px 10px;
      font-size: 12.5px
    }

    .btn:disabled {
      opacity: .5;
      cursor: default
    }

    .chip {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      padding: 5px 13px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 13px
    }

    .chip:hover {
      border-color: var(--acc)
    }

    .chip.on {
      background: var(--acc);
      color: #fff;
      border-color: var(--acc)
    }

    .chip.high.on {
      background: var(--high);
      border-color: var(--high)
    }

    .chip.medium.on {
      background: var(--med);
      border-color: var(--med)
    }

    .chip.low.on {
      background: var(--low);
      border-color: var(--low)
    }

    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap
    }

    .badge.high {
      background: var(--high)
    }

    .badge.medium {
      background: var(--med)
    }

    .badge.low {
      background: var(--low)
    }

    .badge.team {
      background: var(--acc2)
    }

    .badge.grey {
      background: var(--mut)
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px
    }

    th,
    td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      white-space: nowrap
    }

    th {
      color: var(--mut);
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: .05em;
      cursor: default
    }

    th.sortable {
      cursor: pointer
    }

    th.sortable:hover {
      color: var(--acc)
    }

    tbody tr[data-href] {
      cursor: pointer
    }

    tbody tr[data-href]:hover {
      background: var(--soft)
    }

    .scroll {
      overflow: auto
    }

    .bars .b {
      display: grid;
      grid-template-columns: 210px 1fr 76px;
      gap: 10px;
      align-items: center;
      margin: 6px 0;
      font-size: 13px
    }

    .bars .b.click {
      cursor: pointer
    }

    .bars .b.click:hover .lab {
      color: var(--acc)
    }

    .bars.narrow .b {
      grid-template-columns: 70px 1fr 80px
    }

    .bars .lab {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .track {
      height: 10px;
      background: var(--soft);
      border-radius: 6px;
      overflow: hidden;
      display: flex
    }

    .track i {
      display: block;
      height: 100%
    }

    .num {
      color: var(--mut);
      text-align: right;
      font-variant-numeric: tabular-nums
    }

    .vcols {
      display: flex;
      gap: 6px;
      align-items: flex-end;
      height: 130px;
      border-bottom: 1px solid var(--line)
    }

    .vcols .c {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      height: 100%
    }

    .vcols .c div {
      width: 100%;
      border-radius: 4px 4px 0 0;
      min-height: 2px
    }

    .vlab {
      display: flex;
      gap: 6px;
      font-size: 11px;
      color: var(--mut)
    }

    .vlab span {
      flex: 1;
      text-align: center
    }

    .legend {
      display: flex;
      gap: 14px;
      font-size: 12px;
      color: var(--mut);
      margin-top: 6px;
      flex-wrap: wrap
    }

    .legend i {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 3px;
      margin-right: 5px
    }

    svg text {
      fill: var(--mut);
      font-size: 11px
    }

    .sl {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap
    }

    .sl input[type=range] {
      flex: 1;
      min-width: 180px;
      accent-color: var(--acc)
    }

    .mono {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 12.5px
    }

    pre.json {
      background: #0E1020;
      color: #D6E2FF;
      border-radius: 10px;
      padding: 14px;
      overflow: auto;
      max-height: 380px;
      margin: 8px 0 0;
      font-size: 12.5px
    }

    .shap {
      display: grid;
      grid-template-columns: 190px 1fr 56px;
      gap: 10px;
      align-items: center;
      margin: 6px 0;
      font-size: 13px
    }

    .shap .ax {
      position: relative;
      height: 12px;
      background: var(--soft);
      border-radius: 6px
    }

    .shap .ax:before {
      content: "";
      position: absolute;
      left: 50%;
      top: -2px;
      bottom: -2px;
      width: 1px;
      background: var(--mut)
    }

    .shap .ax i {
      position: absolute;
      top: 0;
      bottom: 0;
      border-radius: 6px
    }

    .act {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
      margin: 10px 0;
      background: var(--card)
    }

    .act .t {
      font-weight: 700;
      font-size: 15.5px
    }

    .act p {
      margin: 5px 0
    }

    .tile {
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      color: #fff
    }

    .tile .v {
      font-size: 26px;
      font-weight: 800
    }

    .tile .l {
      font-size: 12px;
      opacity: .95
    }

    .sug {
      position: absolute;
      z-index: 9;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .15);
      min-width: 250px;
      max-height: 260px;
      overflow: auto
    }

    .sug button {
      display: flex;
      width: 100%;
      gap: 10px;
      justify-content: space-between;
      background: none;
      border: 0;
      color: var(--ink);
      padding: 8px 12px;
      text-align: left
    }

    .sug button:hover {
      background: var(--soft)
    }

    #toast {
      position: fixed;
      right: 22px;
      bottom: 22px;
      background: #17182B;
      color: #fff;
      padding: 11px 18px;
      border-radius: 10px;
      opacity: 0;
      transform: translateY(10px);
      transition: .25s;
      pointer-events: none;
      z-index: 50;
      font-weight: 600
    }

    #toast.show {
      opacity: 1;
      transform: none
    }

    .empty {
      padding: 36px;
      text-align: center;
      color: var(--mut)
    }

    .skel {
      height: 90px;
      border-radius: 12px;
      background: linear-gradient(90deg, var(--soft), var(--line), var(--soft));
      background-size: 200% 100%;
      animation: sh 1.2s infinite
    }

    @keyframes sh {
      to {
        background-position: -200% 0
      }
    }

    .note {
      background: var(--soft);
      border-left: 4px solid var(--acc);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      color: var(--mut);
      margin: 12px 0
    }

    .shot {
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      background: var(--soft);
      min-height: 240px;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .shot img {
      width: 100%;
      display: block
    }

    @media(max-width:900px) {
      .bars .b {
        grid-template-columns: 120px 1fr 60px
      }

      #app {
        grid-template-columns: 1fr
      }

      aside {
        position: static;
        height: auto;
        flex-direction: row;
        overflow: auto;
        padding: 10px
      }

      nav {
        flex-direction: row;
        margin: 0 0 0 14px
      }

      .sidefoot,
      .logo small {
        display: none
      }

      #view {
        padding: 16px
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <aside>
      <div class="logo">KAIROS<small>Knowledge Augmented Insights and Retention Optimization System</small></div>
      <nav id="nav">
        <a data-r="overview"><span class="ic">&#9638;</span>Overview</a>
        <a data-r="customer"><span class="ic">&#9786;</span>Customer 360</a>
        <a data-r="planner"><span class="ic">&#9873;</span>Retention planner</a>
        <a data-r="queue"><span class="ic">&#9745;</span>Work queue<span class="cnt" id="qcnt" hidden>0</span></a>
        <a data-r="model"><span class="ic">&#9650;</span>Model validation</a>
        <a data-r="api"><span class="ic">&#8644;</span>API explorer</a>
        <a data-r="powerbi"><span class="ic">&#9636;</span>Power BI report</a>
        <a data-r="status"><span class="ic">&#10003;</span>Project status</a>
      </nav>
      <div class="sidefoot">Semester VII checkpoint<br>Decision support, not a guarantee.</div>
    </aside>
    <main>
      <div class="top">
        <h1 id="title">Overview</h1>
        <div style="position:relative"><input id="gs" placeholder="Jump to customer ID..." autocomplete="off"
            style="width:220px">
          <div id="gsug" class="sug" hidden></div>
        </div>
        <span class="pill" id="health"><span class="dot bad"></span>connecting</span>
        <button class="btn ghost sm" id="theme" title="Toggle dark mode">Theme</button>
      </div>
      <div id="view"></div>
    </main>
  </div>
  <div id="toast"></div>

  <script>
    const API = "/api/v1";
    const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
    const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const money = v => { const n = Math.round(+v || 0); return (n < 0 ? "-$" : "$") + Math.abs(n).toLocaleString() };
    const pct = (v, d = 0) => ((+v || 0) * 100).toFixed(d) + "%";
    const debounce = (f, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => f(...a), ms) } };
    const view = $("#view");
    async function api(path, opt) {
      const t = performance.now();
      try {
        const r = await fetch(API + path, opt); let j = null; try { j = await r.json() } catch (e) { }
        return { ok: r.ok, status: r.status, ms: Math.round(performance.now() - t), json: j }
      }
      catch (e) { return { ok: false, status: 0, ms: 0, json: { error: { code: "NETWORK", message: String(e) } } } }
    }
    const errMsg = r => `${r.json?.error?.code || r.status}: ${r.json?.error?.message || "request failed"}`;
    function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2200) }
    const TIERC = { high: "var(--high)", medium: "var(--med)", low: "var(--low)" };
    const tierBadge = (t, p) => `<span class="badge ${t}">${p == null ? t : pct(p)}</span>`;

    /* ---------- small chart helpers ---------- */
    function donut(data, size = 176) {
      const tot = data.reduce((a, d) => a + d.value, 0) || 1, R = size / 2 - 6, r = R * .62, c = size / 2; let a0 = -Math.PI / 2, out = "";
      data.forEach(d => {
        if (!d.value) return; const a = Math.min(2 * Math.PI * d.value / tot, 2 * Math.PI - .0001), a1 = a0 + a, lg = a > Math.PI ? 1 : 0;
        const p = (rad, ang) => [c + rad * Math.cos(ang), c + rad * Math.sin(ang)]; const [x0, y0] = p(R, a0), [x1, y1] = p(R, a1), [x2, y2] = p(r, a1), [x3, y3] = p(r, a0);
        out += `<path d="M${x0} ${y0}A${R} ${R} 0 ${lg} 1 ${x1} ${y1}L${x2} ${y2}A${r} ${r} 0 ${lg} 0 ${x3} ${y3}Z" fill="${d.color}" opacity="${d.dim ? .35 : 1}" ${d.act ? `data-act="${d.act}" data-v="${d.key}" style="cursor:pointer"` : ""}><title>${esc(d.label)}: ${d.value.toLocaleString()} (${pct(d.value / tot)})</title></path>`; a0 = a1
      });
      return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${out}<text x="${c}" y="${c - 2}" text-anchor="middle" style="font-size:22px;font-weight:800;fill:var(--ink)">${tot.toLocaleString()}</text><text x="${c}" y="${c + 15}" text-anchor="middle">customers</text></svg>`
    }
    function hbars(items, o = {}) {
      const mx = Math.max(...items.map(i => i.total ?? i.value), 1);
      return `<div class="bars ${o.narrow ? "narrow" : ""}">` + items.map(i => {
        const w = (i.total ?? i.value) / mx * 100;
        const inner = i.seg ? i.seg.map(s => `<i style="width:${s.v / (i.total) * w}%;background:${s.c}"></i>`).join("") : `<i style="width:${w}%;background:${i.color || "var(--acc)"}"></i>`;
        return `<div class="b ${i.act ? "click" : ""}" ${i.act ? `data-act="${i.act}" data-v="${esc(i.key)}"` : ""} title="${esc(i.title || i.label)}"><span class="lab">${esc(i.label)}</span><div class="track">${inner}</div><span class="num">${i.display ?? i.value}</span></div>`
      }).join("") + `</div>`
    }
    function vcols(cols, labels, legend) {
      const mx = Math.max(...cols.flatMap(c => c.map(x => x.v)), .0001);
      return `<div class="vcols">` + cols.map(c => `<div class="c" style="flex-direction:row;align-items:flex-end;gap:2px">` + c.map(x => `<div style="height:${x.v / mx * 100}%;background:${x.c}" title="${esc(x.t)}"></div>`).join("") + `</div>`).join("") + `</div><div class="vlab">${labels.map(l => `<span>${l}</span>`).join("")}</div>` + (legend ? `<div class="legend">${legend.map(l => `<span><i style="background:${l.c}"></i>${l.t}</span>`).join("")}</div>` : "")
    }
    function lineChart(o) {
      const W = o.w || 520, H = o.h || 300, m = { l: 60, r: 26, t: 12, b: 38 }, iw = W - m.l - m.r, ih = H - m.t - m.b, X = v => m.l + v / o.xmax * iw, Y = v => m.t + ih - v / o.ymax * ih;
      let s = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px">`;
      for (let i = 0; i <= 4; i++) { const yv = o.ymax * i / 4, xv = o.xmax * i / 4; s += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(yv)}" y2="${Y(yv)}" stroke="var(--line)"/><text x="${m.l - 6}" y="${Y(yv) + 4}" text-anchor="end">${o.yfmt ? o.yfmt(yv) : yv.toFixed(1)}</text><text x="${X(xv)}" y="${H - m.b + 16}" text-anchor="middle">${o.xfmt ? o.xfmt(xv) : xv.toFixed(1)}</text>` }
      if (o.diag) s += `<line x1="${X(0)}" y1="${Y(0)}" x2="${X(o.xmax)}" y2="${Y(o.ymax)}" stroke="var(--mut)" stroke-dasharray="4 4"/>`;
      o.series.forEach(se => {
        const pts = se.pts.map(p => `${X(p[0])},${Y(p[1])}`).join(" "); if (se.area) s += `<polygon points="${X(se.pts[0][0])},${Y(0)} ${pts} ${X(se.pts[se.pts.length - 1][0])},${Y(0)}" fill="${se.color}" opacity=".12"/>`; s += `<polyline points="${pts}" fill="none" stroke="${se.color}" stroke-width="2.4" stroke-linejoin="round"/>`;
        if (se.dots) se.pts.forEach(p => s += `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="3.5" fill="${se.color}"><title>${esc(se.tip ? se.tip(p) : p.join(", "))}</title></circle>`)
      });

  <div class="sl"><input type="range" id="thr" min="0" max="1" step="0.01" value="0.5"><b id="thrv" style="min-width:46px">0.50</b></div>
  <div class="grid g2" style="margin-top:14px"><div id="cm"></div><div id="roc"></div></div></div>
 <div class="grid g2"><div class="card"><h2>Risk deciles: predicted vs actual</h2><p class="sub">Decile 1 = the 10% of customers the model ranks most at risk. Hover a bar for details.</p>${vcols(v.deciles.map(d => [{ v: d.avg_predicted, c: "var(--acc)", t: `Decile ${d.decile}: predicted ${pct(d.avg_predicted)}` }, { v: d.actual_churn_rate, c: "var(--high)", t: `Decile ${d.decile}: actual ${pct(d.actual_churn_rate)} | lift ${d.lift.toFixed(2)}x` }]), v.deciles.map(d => d.decile), [{ c: "var(--acc)", t: "predicted" }, { c: "var(--high)", t: "actual" }])}
   <p class="sub" style="margin-top:10px">Top 3 deciles capture <b>${pct(v.deciles[2].cum_churners_captured, 1)}</b> of all churners. Customers with identical scores are ordered by the raw model score, so counts can differ from the Power BI table by a customer or two.</p></div>
  <div class="card"><h2>Cumulative gains</h2><p class="sub">Share of all churners found by contacting the top X% of customers, against random targeting (dashed).</p>${lineChart({ w: 520, h: 270, xmax: 100, ymax: 100, diag: true, series: [{ pts: [[0, 0], ...v.deciles.map((d, i) => [(i + 1) * 10, d.cum_churners_captured * 100])], color: "var(--acc2)", area: true, dots: true, tip: p => `Top ${p[0]}% of customers: ${p[1].toFixed(0)}% of churners` }], xfmt: x => x + "%", yfmt: y => y + "%", xl: "Customers contacted (ranked by risk)", yl: "Churners captured" })}</div></div>
 <div class="grid g2"><div class="card"><h2>Calibration</h2><p class="sub">When the model says 70%, do about 70% really churn? Points near the diagonal mean yes.</p>${lineChart({ w: 520, h: 270, xmax: 1, ymax: 1, diag: true, series: [{ pts: v.calibration.map(c => [c.avg_predicted, c.actual_rate]), color: "var(--high)", dots: true, tip: p => `Predicted ${pct(p[0])}, actual ${pct(p[1])}` }], xfmt: x => pct(x), yfmt: y => pct(y), xl: "Predicted probability", yl: "Actual churn rate" })}</div>
  <div class="card"><h2>What drives the model overall (SHAP)</h2><p class="sub">Mean absolute SHAP value: average influence on churn risk.</p>${hbars(v.shap_global.map(s => ({ label: s.label, value: s.mean_abs_shap, display: s.mean_abs_shap.toFixed(2), color: "var(--acc)" })))}</div></div>`;
      const upd = () => {
        const t = +$("#thr").value, r = v.thresholds[Math.round(t * 100)]; $("#thrv").textContent = t.toFixed(2);
        const tile = (l, n, c, x) => `<div class="tile" style="background:${c}"><div class="v">${n}</div><div class="l">${l}</div></div>`;
        const flagged = r.tp + r.fp; $("#cm").innerHTML = `<div class="grid" style="grid-template-columns:1fr 1fr;gap:8px;max-width:340px">${tile("True positives: churners caught", r.tp, "var(--low)")}${tile("False positives: false alarms", r.fp, "var(--med)")}${tile("False negatives: churners missed", r.fn, "var(--high)")}${tile("True negatives: correctly left alone", r.tn, "#6A7192")}</div>
   <div class="grid g4" style="margin-top:10px;gap:8px;grid-template-columns:repeat(4,1fr)"><div class="kpi" style="padding:8px 10px"><div class="v" style="font-size:18px">${pct(r.precision)}</div><div class="l">precision</div></div><div class="kpi" style="padding:8px 10px"><div class="v" style="font-size:18px">${pct(r.recall)}</div><div class="l">recall</div></div><div class="kpi" style="padding:8px 10px"><div class="v" style="font-size:18px">${r.f1.toFixed(2)}</div><div class="l">F1</div></div><div class="kpi" style="padding:8px 10px"><div class="v" style="font-size:18px">${pct(r.accuracy)}</div><div class="l">accuracy</div></div></div>
   <p class="sub" style="margin-top:8px">Flagging ${flagged} customers catches ${pct(r.recall)} of all churners.</p>`;
        $("#roc").innerHTML = lineChart({ w: 420, h: 290, xmax: 1, ymax: 1, diag: true, series: [{ pts: v.roc.map(p => [p.fpr, p.tpr]), color: "var(--acc)", area: true }], marker: [r.fp / (r.fp + r.tn), r.recall], xfmt: x => x.toFixed(1), yfmt: y => y.toFixed(1), xl: "False positive rate", yl: "True positive rate (recall)" })
      };
      $("#thr").addEventListener("input", upd); upd()
    }

    /* ---------- API EXPLORER ---------- */
    const EP = [{ n: "Health", m: "GET", u: "/health" }, { n: "Predict", m: "POST", u: "/predict", b: '{"customer_id":"5561-NWEVX"}' }, { n: "Customer detail", m: "GET", u: "/customer-detail/5561-NWEVX" }, { n: "Model metrics", m: "GET", u: "/model-metrics" },
    { n: "Recommend actions", m: "GET", u: "/recommend/5561-NWEVX?limit=3" }, { n: "Action catalogue", m: "GET", u: "/recommend/catalog" }, { n: "Campaign plan", m: "GET", u: "/campaign?budget=1000&limit=5" }, { n: "Search customers", m: "GET", u: "/customers?risk_tier=high&region=West&page_size=5" }, { n: "Model validation", m: "GET", u: "/model/validation" }, { n: "Budget curve", m: "GET", u: "/campaign/curve?max_budget=3000&points=6" }, { n: "Error demo (unknown ID)", m: "GET", u: "/recommend/0000-NOPE" }];
    function vApi() {
      view.innerHTML = `<div class="card"><h2>API explorer</h2><p class="sub">Every endpoint of the backend, live. Pick one, edit the URL or body, and send.</p><div class="row" style="gap:6px">${EP.map((e, i) => `<button class="chip" data-act="ep" data-v="${i}">${esc(e.n)}</button>`).join("")}</div>
 <div class="row" style="margin-top:14px;flex-wrap:nowrap"><select id="am"><option>GET</option><option>POST</option></select><span class="mono" style="color:var(--mut)">/api/v1</span><input id="au" class="mono" style="flex:1" value="/health"><button class="btn" data-act="send">Send</button></div>
 <textarea id="ab" class="mono" rows="2" style="width:100%;margin-top:8px" placeholder='JSON body (for POST)'></textarea><div id="ameta" class="sub" style="margin-top:10px"></div><pre class="json" id="aout">Press Send.</pre></div>`}
    async function sendApi() {
      const m = $("#am").value, u = $("#au").value.trim(); const opt = { method: m }; if (m === "POST") { opt.headers = { "Content-Type": "application/json" }; opt.body = $("#ab").value || "{}" }
      $("#aout").textContent = "Loading..."; const r = await api(u, opt); const txt = JSON.stringify(r.json, null, 2) || "";
      $("#ameta").innerHTML = `<span class="badge ${r.ok ? "low" : "high"}">HTTP ${r.status}</span> &nbsp; ${r.ms} ms &nbsp; ${(txt.length / 1024).toFixed(1)} KB`; $("#aout").textContent = txt.length > 9000 ? txt.slice(0, 9000) + "\n... (truncated, " + txt.length + " characters)" : txt
    }

    /* ---------- POWER BI + STATUS ---------- */
    const PB = [["Operations overview", "KPIs, risk tiers and the at-risk list."], ["Customer drill-through", "One customer: risk, drivers, history."], ["Model validation", "Quality, lift and calibration."], ["What-if", "Save-rate slicer and illustrative revenue saved."]];
    const pbiUrl = () => { try { return localStorage.getItem("kairos_pbi_url") || "" } catch (e) { return "" } };
    function parsePbi(raw) { raw = (raw || "").trim(); const m = raw.match(/src\s*=\s*["']([^"']+)["']/i); const u = (m ? m[1] : raw).replace(/&amp;/g, "&"); return /^https:\/\/app\.powerbi(gov)?\.(com|us)\//i.test(u) ? u : "" }
    function vPowerBI() {
      const u = pbiUrl();
      if (u) {
        view.innerHTML = `<div class="card"><div class="row" style="justify-content:space-between"><div><h2>Power BI operations report (live)</h2><p class="sub" style="margin:0">The real report, embedded. Use the page tabs at the bottom of the report to switch pages, and click, filter and drill as in Power BI.</p></div><button class="btn ghost sm" data-act="pbreset">Change or remove link</button></div></div>
  <iframe title="Power BI report" src="${esc(u)}" allowfullscreen style="width:100%;height:calc(100vh - 210px);min-height:540px;border:1px solid var(--line);border-radius:12px;background:var(--card)"></iframe>`; return
      }
      view.innerHTML = `<div class="card"><h2>Power BI operations report</h2><p class="sub">Screenshots of the report built in Power BI Desktop. Connect the live report below to make it interactive inside this app. The Overview, Customer 360, Model validation and Retention planner pages are interactive web versions of the same ideas, built on the same model outputs.</p><div class="row" style="gap:6px" id="pbtabs">${PB.map((p, i) => `<button class="chip ${i ? "" : "on"}" data-act="pb" data-v="${i}">${p[0]}</button>`).join("")}</div><p class="sub" id="pbcap" style="margin:10px 0">${PB[0][1]}</p><div class="shot" id="pbshot"></div></div>
 <div class="card"><h2>Connect the live report</h2><p class="sub">A .pbix file cannot run inside a web page by itself. Publish it once, then paste the link here.</p>
  <ol class="sub" style="margin:0 0 12px;padding-left:20px;line-height:1.8"><li>In Power BI Desktop choose <b>Publish</b> and pick your workspace (needs a Power BI account).</li><li>Open the report in the Power BI service, then <b>File, Embed report, Publish to web (public)</b>. If that option is missing or greyed out, your account administrator has disabled it.</li><li>Copy the link (or the whole iframe code) and paste it below.</li></ol>
  <div class="row" style="flex-wrap:nowrap"><input id="pburl" class="mono" style="flex:1" placeholder="https://app.powerbi.com/view?r=..."><button class="btn" data-act="pbconnect">Connect</button></div>
  <div class="note">Publish to web makes the report visible to anyone with the link. This project uses public Telco data and synthetic tables, but check you are comfortable with that. Signed-in "Secure embed" links (also starting with https://app.powerbi.com/) work too for people who have access.</div></div>`; pbShow(0)
    }
    function pbShow(i) { $$("#pbtabs .chip").forEach((c, j) => c.classList.toggle("on", j === i)); $("#pbcap").textContent = PB[i][1]; $("#pbshot").innerHTML = `<img src="/ui/dashboard/page${i + 1}.png" onerror="this.parentNode.innerHTML='<div class=empty>Add your screenshot as <code>src/ui/dashboard/page${i + 1}.png</code></div>'">` }
    function vStatus() {
      const R = (a, s, d) => `<tr><td><b>${a}</b></td><td><span class="badge ${s === "Built" ? "low" : "grey"}">${s}</span></td><td class="sub" style="white-space:normal">${d}</td></tr>`;
      view.innerHTML = `<div class="card"><h2>What is built vs planned</h2><div class="scroll"><table><thead><tr><th>Component</th><th>Status</th><th>Detail</th></tr></thead><tbody>` +
        R("Data layer", "Built", "8-table PostgreSQL schema (Supabase), leakage-safe features, loader with verification") + R("Churn models", "Built", "Logistic Regression, XGBoost (SHAP, calibrated, served), LSTM comparison") + R("Power BI operations dashboard", "Built", "4 pages fed by model outputs") + R("Interactive web app", "Built", "Filters, customer search, SHAP drivers, threshold explorer, planner, work queue, API explorer") + R("Retention Action Engine", "Built", "Explainable per-customer actions from SHAP drivers and customer facts, budget-constrained planner, backtest. Costs and save rates are assumptions.") + R("REST API", "Built", "10 endpoints, CSV and Postgres backends with parity check, automated tests") +
        R("JWT authentication", "Sem VIII", "Currently open (no auth)") + R("Live scoring, batch-predict", "Sem VIII", "/predict serves stored predictions only") + R("Drift monitoring and MLflow", "Sem VIII", "Drift fields are placeholders until then") + R("Tableau executive dashboard", "Sem VIII", "") + R("Causal uplift testing", "Sem VIII", "Needs intervention data to measure whether actions really retain customers") + R("Chat / hybrid RAG (Module B)", "Sem VIII", "Conversational layer over the data and explanations") + R("Evaluation harness, Docker, paper", "Sem VIII", "") + `</tbody></table></div></div>`
    }

    /* ---------- global events ---------- */
    document.addEventListener("click", e => {
      const t = e.target.closest("[data-act],[data-href]"); if (!t) return;
      if (t.dataset.href) { location.hash = t.dataset.href; return }
      const a = t.dataset.act, v = t.dataset.v;
      if (a === "tier") { F.tiers.has(v) ? F.tiers.delete(v) : F.tiers.add(v); F.page = 1; loadOverview() }
      else if (a === "region") { F.region = F.region === v ? "" : v; F.page = 1; loadOverview() }
      else if (a === "reset") { Object.assign(F, { q: "", region: "", contract: "", band: "", sort: "probability", order: "desc", page: 1 }); F.tiers.clear(); vOverview() }
      else if (a === "sort") { F.order = F.sort === v && F.order === "desc" ? "asc" : "desc"; F.sort = v; F.page = 1; loadOverview() }
      else if (a === "page") { F.page = Math.max(1, F.page + +v); loadOverview() }
      else if (a === "cgo") { const id = $("#cq").value.trim(); if (id) location.hash = "#/customer/" + encodeURIComponent(id) }
      else if (a === "addq") { const r = window._rec.recommendations[+t.dataset.i]; toast(addQ({ customer_id: window._rec.customer_id, action_id: r.action_id, action: r.action, owner_team: r.owner_team, cost: r.cost, net_value: r.net_value }) ? "Added to work queue" : "Already in the queue") }
      else if (a === "addrow") { const c = LASTPLAN.selected[+t.dataset.i]; toast(addQ(c) ? "Added to work queue" : "Already in the queue") }
      else if (a === "addplan") { let n = 0; LASTPLAN.selected.forEach(c => { if (addQ(c)) n++ }); toast(n + " action(s) added to the work queue") }
      else if (a === "rmq") { Q.splice(+t.dataset.i, 1); saveQ(); vQueue() }
      else if (a === "clearq") { if (confirm("Remove every item from the queue?")) { Q = []; saveQ(); vQueue() } }
      else if (a === "exportq") {
        const rows = [["customer_id", "action", "team", "cost", "expected_net_value", "status", "added"], ...Q.map(q => [q.customer_id, q.action, q.owner_team, q.cost, q.net_value, q.status, q.added])];
        const blob = new Blob([rows.map(r => r.map(x => `"${String(x).replace(/"/g, '""')}"`).join(",")).join("\n")], { type: "text/csv" }); const l = document.createElement("a"); l.href = URL.createObjectURL(blob); l.download = "kairos_work_queue.csv"; l.click()
      }
      else if (a === "ep") { const x = EP[+v]; $("#am").value = x.m; $("#au").value = x.u; $("#ab").value = x.b || ""; sendApi() }
      else if (a === "send") sendApi();
      else if (a === "pb") pbShow(+v)
      else if (a === "pbconnect") { const u = parsePbi($("#pburl").value); if (!u) { toast("Paste the link or iframe code from Power BI (it starts with https://app.powerbi.com/)"); return } try { localStorage.setItem("kairos_pbi_url", u) } catch (e) { } toast("Live report connected"); vPowerBI() }
      else if (a === "pbreset") { try { localStorage.removeItem("kairos_pbi_url") } catch (e) { } vPowerBI() }
    });
    document.addEventListener("input", e => {
      const t = e.target;
      if (t.dataset.bind === "q") { F.q = t.value; F.page = 1; dQ() }
      else if (t.dataset.p) { const k = t.dataset.p; P[k] = t.type === "range" || k === "horizon" ? +t.value : t.value; if (k === "budget") $("#pv_budget").textContent = money(P.budget); if (k === "scale") $("#pv_scale").textContent = P.scale + "x"; dPlan(k === "scale" || k === "horizon") }
      else if (t.dataset.cap !== undefined) { P.cap[t.dataset.cap] = t.value; dPlan(false) }
      else if (t.dataset.cs === "scale") { CS.scale = +t.value; $("#csv").textContent = CS.scale + "x"; dCust() }
    });
    document.addEventListener("change", e => {
      const t = e.target;
      if (t.dataset.bind && t.dataset.bind !== "q") { F[t.dataset.bind] = t.value; F.page = 1; loadOverview() }
      else if (t.dataset.cs === "horizon") { CS.horizon = +t.value; dCust() }
      else if (t.dataset.qs !== undefined) { Q[+t.dataset.qs].status = t.value; saveQ(); vQueue() }
      else if (t.dataset.p === "horizon") { }
    });
    const dQ = debounce(() => loadOverview(), 280), dPlan = debounce(c => { loadPlan(); if (c) loadCurve() }, 260), dCust = debounce(() => vCustomer(lastCust), 260);
    /* typeahead (header box and Customer 360 box) */
    function typeahead(inp, box, go) {
      const run = debounce(async () => {
        const q = inp.value.trim(); if (q.length < 2) { box.hidden = true; return }
        const r = await api("/customers?q=" + encodeURIComponent(q) + "&page_size=8"); if (!r.ok || !r.json.items.length) { box.hidden = true; return }
        box.innerHTML = r.json.items.map(c => `<button data-id="${esc(c.customer_id)}"><span class="mono">${esc(c.customer_id)}</span>${tierBadge(c.risk_tier, c.churn_probability)}</button>`).join(""); box.hidden = false
      }, 200);
      inp.addEventListener("input", run); inp.addEventListener("keydown", e => { if (e.key === "Enter" && inp.value.trim()) { box.hidden = true; go(inp.value.trim()) } });
      box.addEventListener("click", e => { const b = e.target.closest("button"); if (b) { box.hidden = true; go(b.dataset.id) } })
    }
    const goCust = id => { location.hash = "#/customer/" + encodeURIComponent(id) };
    typeahead($("#gs"), $("#gsug"), id => { $("#gs").value = ""; goCust(id) });
    document.addEventListener("click", e => { if (!e.target.closest(".sug,input")) $$(".sug").forEach(s => s.hidden = true) });
    new MutationObserver(() => { const q = $("#cq"); if (q && !q._ta) { q._ta = 1; typeahead(q, $("#csug"), goCust) } }).observe(view, { childList: true });
    /* theme + health */
    const setTheme = t => { document.documentElement.dataset.theme = t; try { localStorage.setItem("kairos_theme", t) } catch (e) { } };
    setTheme((() => { try { return localStorage.getItem("kairos_theme") } catch (e) { } })() || (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light"));
    $("#theme").onclick = () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
    (async () => { const r = await api("/health"); $("#health").innerHTML = r.ok ? `<span class="dot"></span>API online | model ${esc(r.json.serving_model_id || "none")} | ${(r.json.predictions || 0).toLocaleString()} scored customers` : `<span class="dot bad"></span>API offline` })();
    saveQ(); route();
  </script>
</body>

</html>
